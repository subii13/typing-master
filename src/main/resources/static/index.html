<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>keyrace</title>
</head>
<body>
  <h1>keyrace</h1>
  <nav>
    <button id="tab-type">type</button>
    <button id="tab-history">history</button>
    <button id="tab-heatmap">heatmap</button>
  </nav>

  <div id="view-type">
  <div id="stats">
    <span>WPM: <b id="wpm">0</b></span>
    <span>Accuracy: <b id="accuracy">100</b>%</span>
    <span>Ghost: <b id="ghost-wpm">—</b></span>
  </div>
  <div id="race-track" style="position:relative; height:30px; background:#eee; margin-bottom:10px;">
  <div id="ghost-marker" style="position:absolute; top:0; left:0; width:4px; height:100%; background:orange;"></div>
  <div id="player-marker" style="position:absolute; top:0; left:0; width:4px; height:100%; background:blue;"></div>
</div>
  <p id="passage"></p>
  <input type="text" id="hidden-input" autocomplete="off" style="position:absolute; opacity:0;" />
</div>

  <div id="view-history" style="display:none;">
    <table border="1" cellpadding="6">
      <thead>
        <tr><th>Passage ID</th><th>WPM</th><th>Accuracy</th></tr>
      </thead>
      <tbody id="history-body"></tbody>
    </table>
  </div>
  
  <div id="view-heatmap" style="display:none;">
    <div id="heatmap-grid"></div>
  </div>

  <script>
    let passage = null;
    let typedIndex = 0;
    let startTime = null;
    let totalKeystrokes = 0;
    let correctKeystrokes = 0;
    let charStatus = [];
    let errorsByChar = {};
    let charTimings = [];
    let ghost=null;
    let ghostTimings = null;
    async function loadPassage() {
      const res = await fetch('/api/passages/random');
      passage = await res.json();
      typedIndex = 0;
      startTime = null;
      totalKeystrokes = 0;
      correctKeystrokes = 0;
      charStatus = [];
      charTimings=[];
      errorsByChar = {};
      const ghostRes = await fetch(`/api/sessions/ghost/${passage.id}`);
      const ghostText = await ghostRes.text();
      ghost = ghostText ? JSON.parse(ghostText) : null;
      ghostTimings = (ghost && ghost.timingArrayJson) ? JSON.parse(ghost.timingArrayJson) : null;
      renderPassage();
      document.getElementById('ghost-wpm').textContent = ghost ? Math.round(ghost.wpm) : '—';
    }

    function renderPassage() {
      const chars = passage.text.split('');
      document.getElementById('passage').innerHTML = chars.map((c, i) => {
        let color = 'black';
        if (i < typedIndex) color = charStatus[i] === 'wrong' ? 'red' : 'green';
        return `<span style="color:${color}">${c}</span>`;
      }).join('');
    }

    async function finishRun() {
      const elapsedMs = performance.now() - startTime;
      const minutes = elapsedMs / 60000;
      const wpm = (passage.text.length / 5) / minutes;
      const accuracy = (correctKeystrokes / totalKeystrokes) * 100;

      document.getElementById('wpm').textContent = Math.round(wpm);
      document.getElementById('accuracy').textContent = Math.round(accuracy);
      console.log('Sending errorsByChar:', errorsByChar);
      console.log('Sending charTimings:',charTimings);
      const res = await fetch('/api/sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          passageId: passage.id,
          wpm: wpm,
          accuracy: accuracy,
          errorsByChar: errorsByChar,
          charTimings: charTimings
        })
      });
      const saved = await res.json();
      console.log('Session saved:', saved);
    }

    document.addEventListener('keydown', (e) => {
      if (!passage || e.key.length !== 1) return;
      if (typedIndex >= passage.text.length) return;

      if (startTime === null) {
        startTime = performance.now();
        animateGhost();
      }

      const expected = passage.text[typedIndex];
      totalKeystrokes++;
      if (e.key === expected) {
        correctKeystrokes++;
        charStatus[typedIndex] = 'correct';
      } else {
        charStatus[typedIndex] = 'wrong';
        errorsByChar[expected] = (errorsByChar[expected] || 0) + 1;
      }
      charTimings[typedIndex]=Math.round(performance.now() - startTime);
      typedIndex++;
      renderPassage();

      const elapsedMin = (performance.now() - startTime) / 60000;
      const wpm = elapsedMin > 0 ? Math.round((typedIndex / 5) / elapsedMin) : 0;
      const accuracy = Math.round((correctKeystrokes / totalKeystrokes) * 100);
      document.getElementById('wpm').textContent = wpm;
      document.getElementById('accuracy').textContent = accuracy;

      if (typedIndex === passage.text.length) {
        finishRun();
      }
    });

    document.getElementById('passage').addEventListener('click', () => {
      document.getElementById('hidden-input').focus();
    });

    async function loadHistory() {
      const res = await fetch('/api/sessions');
      const sessions = await res.json();
      const body = document.getElementById('history-body');
      body.innerHTML = sessions.map(s => `
        <tr>
          <td>${s.passageId}</td>
          <td>${s.wpm.toFixed(1)}</td>
          <td>${s.accuracy.toFixed(1)}%</td>
        </tr>
      `).join('');
    }

    async function loadHeatmap() {
      const res = await fetch('/api/sessions/heatmap');
      const data = await res.json();
      const grid = document.getElementById('heatmap-grid');

      const entries = Object.entries(data).sort((a, b) => b[1] - a[1]);
      const max = entries.length ? entries[0][1] : 1;

      grid.innerHTML = entries.map(([char, count]) => {
        const intensity = count / max;
        const label = char === ' ' ? '(space)' : char;
        return `<span style="display:inline-block; padding:8px 12px; margin:4px;
          background: rgba(255,0,0,${intensity}); border:1px solid #ccc;">
          ${label}: ${count}
        </span>`;
      }).join('');
    }

    function showView(view) {
      document.getElementById('view-type').style.display = view === 'type' ? 'block' : 'none';
      document.getElementById('view-history').style.display = view === 'history' ? 'block' : 'none';
      document.getElementById('view-heatmap').style.display = view === 'heatmap' ? 'block' : 'none';
    }
    function ghostIndexAtTime(elapsedMs) {
      if (!ghostTimings) return 0;
      let idx = 0;
      while (idx < ghostTimings.length && ghostTimings[idx] <= elapsedMs) {
        idx++;
      }
      return idx;
    }
    function updateMarkers(ghostIdx) {
      const total = passage.text.length;
      const trackWidth = document.getElementById('race-track').offsetWidth;

      const playerPct = typedIndex / total;
      const ghostPct = ghostIdx / total;

      document.getElementById('player-marker').style.left = (playerPct * trackWidth) + 'px';
      document.getElementById('ghost-marker').style.left = (ghostPct * trackWidth) + 'px';
    }

    function animateGhost() {
      if (!startTime || typedIndex >= passage.text.length) return;

      const elapsedMs = performance.now() - startTime;
      const ghostIdx = ghostIndexAtTime(elapsedMs);
      updateMarkers(ghostIdx);

      requestAnimationFrame(animateGhost);
    }
    document.getElementById('tab-type').addEventListener('click', () => {
      showView('type');
    });

    document.getElementById('tab-history').addEventListener('click', () => {
      showView('history');
      loadHistory();
    });

    document.getElementById('tab-heatmap').addEventListener('click', () => {
      showView('heatmap');
      loadHeatmap();
    });

    loadPassage();
  </script>
</body>
</html>
