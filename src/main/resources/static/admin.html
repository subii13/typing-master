<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>keyrace admin</title>
</head>
<body>
  <h1>Add a passage</h1>
  <p>Use actual line breaks in the box below for multi-line passages — no need to type \n manually.</p>

  <textarea id="passage-text" rows="6" cols="60" placeholder="Type or paste passage text here..."></textarea>
  <br><br>
  <button id="submit-btn">Add passage</button>

  <p id="status"></p>

  <script>
    document.getElementById('submit-btn').addEventListener('click', async () => {
      const text = document.getElementById('passage-text').value.trim();
      if (!text) {
        document.getElementById('status').textContent = 'Please enter some text first.';
        return;
      }

      const res = await fetch('/api/passages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text })
      });

      if (res.ok) {
        const saved = await res.json();
        document.getElementById('status').textContent = `Saved! New passage id: ${saved.id}`;
        document.getElementById('passage-text').value = '';
      } else {
        document.getElementById('status').textContent = 'Something went wrong — check the console.';
      }
    });
  </script>
</body>
</html>
